name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: requirements.txt coincide con uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --all-groups --no-emit-project --quiet -o /tmp/req.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)
      - name: Instalar dependencias
        run: uv sync --all-groups --python 3.12
      - name: Lint
        run: uv run ruff check src tests notebooks
      - name: Tests (incluye integridad de los datos crudos)
        run: uv run pytest
      - name: Scripts de promociones y potencial
        run: |
          uv run python -m retail_analytics.analyses promotions
          uv run python -m retail_analytics.analyses potential

  # Comprueba que las instrucciones de Windows funcionan tal como están en el README.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Entorno con make.bat
        run: .\make.bat setup
      - name: Tests con make.bat (incluye integridad de los datos crudos)
        run: .\make.bat test-all
      - name: Scripts con make.bat
        run: |
          .\make.bat promotions
          .\make.bat potential
