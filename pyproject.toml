[project]
name = "retail-analytics"
version = "0.1.0"
description = "Pronóstico de demanda, potencial de tiendas y evaluación de promociones para una cadena de retail en México."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Miguel Millán Dorado" }]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pandera>=0.20",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fsspec>=2024.2",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
    "mlflow>=3.17.2",
    "geopandas>=1.2.0",
    "folium>=0.20.0",
]

[project.optional-dependencies]
# Lectura directa desde Google Cloud Storage (gs://). Credenciales vía GOOGLE_APPLICATION_CREDENTIALS.
gcs = ["gcsfs>=2024.2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "NPY", "PD"]
ignore = ["D100", "D104", "D203", "D213", "PD010", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E501", "B018"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["data: tests que leen los CSV reales de data/raw (más lentos)"]
